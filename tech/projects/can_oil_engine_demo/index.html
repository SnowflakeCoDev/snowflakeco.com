<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Oil Engine System — static bilingual frontend demo for an Egyptian engine-oil shop.">
  <title>محتاج سيستم | Oil Engine System</title>
  <link rel="icon" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/rtl.css"><link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="landing public-page" data-page="landing">
  <header class="public-header">
    <a class="public-brand" href="index.html"><img src="assets/images/logo-horizontal.svg" alt="Oil Engine System"></a>
    <div class="public-actions"><button class="btn btn-secondary" type="button" data-action="switch-language">English</button><a class="btn btn-primary" href="login.html" data-i18n="viewDemo"></a></div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-inner"><div class="hero-copy">
        <span class="eyebrow" data-i18n="heroEyebrow"></span><h1 data-i18n="heroTitle"></h1><p data-i18n="heroText"></p>
        <div class="hero-actions"><a class="btn btn-primary" href="login.html" data-i18n="viewDemo"></a><a class="btn btn-secondary" href="#features" data-i18n="exploreFeatures"></a></div>
        <div class="hero-proof"><span data-i18n="noInstall"></span><span data-i18n="bilingual"></span><span data-i18n="preciseLitres"></span></div>
      </div></div>
    </section>
    <div class="demo-strip" data-i18n="demoNotice"></div>
    <section class="section" id="features"><div class="section-inner"><div class="section-heading"><span class="eyebrow" data-i18n="benefitsTitle"></span><h2 data-i18n="benefitsTitle"></h2><p data-i18n="benefitsText"></p></div>
      <div class="feature-grid">
        <article class="card feature-card"><span class="feature-icon">▥</span><h3 data-i18n="benefitInventory"></h3><p class="muted" data-i18n="benefitInventoryText"></p></article>
        <article class="card feature-card"><span class="feature-icon">◔</span><h3 data-i18n="benefitDecimal"></h3><p class="muted" data-i18n="benefitDecimalText"></p></article>
        <article class="card feature-card"><span class="feature-icon">↗</span><h3 data-i18n="benefitProfit"></h3><p class="muted" data-i18n="benefitProfitText"></p></article>
        <article class="card feature-card"><span class="feature-icon">⇧</span><h3 data-i18n="benefitUpload"></h3><p class="muted" data-i18n="benefitUploadText"></p></article>
        <article class="card feature-card"><span class="feature-icon">!</span><h3 data-i18n="benefitAlert"></h3><p class="muted" data-i18n="benefitAlertText"></p></article>
        <article class="card feature-card"><span class="feature-icon">◒</span><h3 data-i18n="benefitReports"></h3><p class="muted" data-i18n="benefitReportsText"></p></article>
      </div>
    </div></section>
    <section class="section preview-section"><div class="section-inner"><div class="section-heading"><span class="eyebrow">SYSTEM PREVIEW</span><h2 data-i18n="previewTitle"></h2><p data-i18n="previewText"></p></div>
      <div class="browser-frame"><div class="browser-top"><i></i><i></i><i></i></div><div class="mock-app"><div class="mock-side"><div class="mock-logo"></div><div class="mock-line"></div><div class="mock-line"></div><div class="mock-line"></div><div class="mock-line"></div></div><div class="mock-main"><div class="mock-metrics"><div class="mock-metric"></div><div class="mock-metric"></div><div class="mock-metric"></div></div><div class="mock-chart"></div></div></div></div>
    </div></section>
    <section class="section"><div class="section-inner"><div class="section-heading"><h2 data-i18n="workflowTitle"></h2></div><div class="steps"><article class="card step"><h3 data-i18n="step1"></h3></article><article class="card step"><h3 data-i18n="step2"></h3></article><article class="card step"><h3 data-i18n="step3"></h3></article><article class="card step"><h3 data-i18n="step4"></h3></article></div></div></section>
    <section class="section preview-section"><div class="section-inner"><div class="section-heading"><h2 data-i18n="vehiclesTitle"></h2></div><div class="vehicle-grid">
      <article class="card vehicle-card"><span class="big-icon">🚗</span><div><h3 data-i18n="car"></h3><p class="muted" data-i18n="vehicleCarText"></p></div></article>
      <article class="card vehicle-card"><span class="big-icon">🛺</span><div><h3 data-i18n="tuktuk"></h3><p class="muted" data-i18n="vehicleTukText"></p></div></article>
      <article class="card vehicle-card"><span class="big-icon">🏍</span><div><h3 data-i18n="motorcycle"></h3><p class="muted" data-i18n="vehicleMotoText"></p></div></article>
    </div></div></section>
  </main>
  <footer class="public-footer"><img src="assets/images/logo-icon.svg" alt="" width="52" style="margin:0 auto 14px"><p data-i18n="footerText"></p><small data-i18n="demoNotice"></small></footer>
  <div class="toast-region" aria-live="polite"></div>
  <script src="assets/js/translations.js"></script><script src="assets/js/demo-data.js"></script><script src="assets/js/common.js"></script><script src="assets/js/landing.js"></script>
</body></html>
