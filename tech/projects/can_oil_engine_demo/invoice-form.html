<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة جديدة | Oil Engine</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/rtl.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body data-page="invoice-form"><main>
<form id="invoice-form"><div class="content-grid">
  <div><section class="card"><div class="card-header"><h2 data-i18n="invoiceDetails"></h2><span class="badge badge-warning" data-i18n="demoNotice"></span></div><div class="form-grid">
    <div class="field"><label for="invoice-date" data-i18n="invoiceDate"></label><input id="invoice-date" type="datetime-local" value="2026-07-28T15:30"></div>
    <div class="field"><label for="vehicle-type" data-i18n="vehicleType"></label><select id="vehicle-type"><option value="car" data-i18n="car"></option><option value="tuktuk" data-i18n="tuktuk"></option><option value="motorcycle" data-i18n="motorcycle"></option><option value="other" data-i18n="other"></option></select></div>
    <div class="field"><label for="customer-name" data-i18n="customerName"></label><input id="customer-name" value="أحمد سمير"></div>
    <div class="field"><label for="customer-phone" data-i18n="customerPhone"></label><input id="customer-phone" type="tel" value="0100 555 0198"></div>
    <div class="field"><label for="plate" data-i18n="plateNo"></label><input id="plate" value="ن س ر ٤٢٨١"></div>
    <div class="field"><label for="model" data-i18n="vehicleModel"></label><input id="model" value="Toyota Corolla 2019"></div>
    <div class="field"><label for="payment" data-i18n="paymentMethod"></label><select id="payment"><option value="cash" data-i18n="cash"></option><option value="card" data-i18n="card"></option><option value="wallet" data-i18n="wallet"></option><option value="bank" data-i18n="bank"></option></select></div>
    <div class="field"><label for="invoice-notes" data-i18n="notes"></label><input id="invoice-notes"></div>
  </div></section>
  <section class="card" style="margin-top:20px"><div class="card-header"><h2 data-i18n="invoiceItems"></h2><button class="btn btn-secondary" type="button" data-add-line>＋ <span data-i18n="add"></span></button></div><div id="invoice-lines" class="invoice-lines"></div></section></div>
  <aside><section class="card summary-box"><div class="card-header"><h2 data-i18n="total"></h2></div><div class="summary-row"><span data-i18n="subtotal"></span><strong id="sum-subtotal"></strong></div><div class="field"><label for="discount" data-i18n="discount"></label><input id="discount" type="number" min="0" step=".01" value="0"></div><div class="summary-row"><span data-i18n="discount"></span><strong id="sum-discount"></strong></div><div class="summary-row total"><span data-i18n="finalTotal"></span><strong id="sum-total"></strong></div><hr><div class="summary-row owner-only"><span data-i18n="cost"></span><strong id="sum-cost"></strong></div><div class="summary-row owner-only"><span data-i18n="profit"></span><strong id="sum-profit" class="gold"></strong></div><div class="employee-guard restricted-card"><strong data-i18n="ownerOnly"></strong></div><p id="confirmed-preview" class="badge badge-success hide" data-i18n="confirmed"></p><button class="btn btn-primary" style="width:100%" type="submit" data-i18n="confirmInvoice"></button><button class="btn btn-secondary" style="width:100%;margin-top:9px" type="button" data-save-draft data-i18n="saveDraft"></button></section></aside>
</div></form>
<div class="modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-hidden="true"><div class="modal-card"><div class="modal-header"><h2 id="confirm-title" data-i18n="confirmInvoice"></h2><button class="btn btn-icon btn-ghost" type="button" data-action="close-modal">×</button></div><p data-i18n="confirmQuestion"></p><p class="muted" data-i18n="demoNotice"></p><div class="actions-row"><button class="btn btn-secondary" type="button" data-action="close-modal" data-i18n="cancel"></button><button class="btn btn-primary" type="button" data-final-confirm data-i18n="confirm"></button></div></div></div>
</main><script src="assets/js/translations.js"></script><script src="assets/js/demo-data.js"></script><script src="assets/js/common.js"></script><script src="assets/js/invoice-form.js"></script></body></html>
