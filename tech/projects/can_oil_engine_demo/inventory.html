<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المخزون | Oil Engine</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/rtl.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body data-page="inventory"><main>
<div id="inventory-root"></div>
<div class="modal" id="adjust-modal" role="dialog" aria-modal="true" aria-labelledby="adjust-title" aria-hidden="true"><form class="modal-card" id="adjust-form"><div class="modal-header"><h2 id="adjust-title" data-i18n="adjustStock"></h2><button class="btn btn-icon btn-ghost" type="button" data-action="close-modal">×</button></div><input id="adjust-product" type="hidden"><p><strong id="adjust-product-name"></strong></p><div class="form-grid">
  <div class="field"><label for="adjust-type" data-i18n="adjustmentType"></label><select id="adjust-type"><option value="addStock" data-i18n="addStock"></option><option value="removeStock" data-i18n="removeStock"></option><option value="correction" data-i18n="correction"></option></select></div>
  <div class="field"><label for="adjust-qty" data-i18n="quantity"></label><input id="adjust-qty" type="number" min=".001" step=".001" value=".500" required></div>
  <div class="field"><label for="adjust-reason" data-i18n="reason"></label><select id="adjust-reason"><option>جرد / Stock count</option><option>تلف / Damage</option><option>تصحيح / Correction</option></select></div>
  <div class="field"><label for="adjust-notes" data-i18n="notes"></label><input id="adjust-notes"></div></div><div class="actions-row"><button class="btn btn-secondary" type="button" data-action="close-modal" data-i18n="cancel"></button><button class="btn btn-primary" type="submit" data-i18n="confirm"></button></div></form></div>
</main><script src="assets/js/translations.js"></script><script src="assets/js/demo-data.js"></script><script src="assets/js/common.js"></script><script src="assets/js/inventory.js"></script></body></html>
