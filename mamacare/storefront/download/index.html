<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f7">
  <meta name="description" content="Download MamaCare Hub for iPhone, iPad, or Android.">
  <title>Download · MamaCare Hub</title>
  <link rel="icon" href="../../favicon.png">
  <style>
    :root { color-scheme:light; --plum:#5a2a38; --muted:#78656c; --line:#eedfdf; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#fff9f7;
      color:var(--plum);
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
      font-size:1rem;
      line-height:1.7;
    }
    main {
      width:100%;
      max-width:480px;
      padding:40px 32px;
      text-align:center;
      background:white;
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 10px 40px #5a2a3805;
    }
    .logo { width:80px; height:80px; object-fit:cover; border:2px solid #f3d9d3; border-radius:50%; }
    .brand { margin:16px 0 8px; font-weight:700; }
    h1 { margin:0 0 16px; font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:clamp(2rem,7vw,2.75rem); line-height:1.2; }
    p { color:var(--muted); }
    .store-links { display:grid; gap:12px; margin-top:28px; }
    .store-link {
      display:block;
      padding:14px 20px;
      border:2px solid var(--plum);
      border-radius:12px;
      background:var(--plum);
      color:white;
      text-decoration:none;
      font-weight:600;
    }
    .store-link:hover { background:#743b4b; border-color:#743b4b; }
    .store-link:focus-visible { outline:3px solid #c9686f; outline-offset:4px; }
    [hidden] { display:none !important; }
    noscript p { margin-bottom:0; font-size:0.875rem; }
    @media (max-width:400px) {
      body { padding:16px; }
      main { padding:32px 20px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <img class="logo" src="../../logo.jpg" alt="MamaCare Hub logo" width="80" height="80">
    <p class="brand">MamaCare Hub</p>
    <h1 id="title">Download the app</h1>
    <p id="device-message" role="status">Choose your device’s app store to download MamaCare Hub.</p>
    <div class="store-links" aria-label="App stores">
      <a id="ios-link" class="store-link" href="https://apps.apple.com/us/app/mama-care-hub/id6751168561">Download on the App Store</a>
      <a id="android-link" class="store-link" href="https://play.google.com/store/apps/details?id=app.snowflakeco.mama_care_hub_app">Get it on Google Play</a>
    </div>
    <noscript><p>Enable JavaScript to automatically select the app store for your device.</p></noscript>
  </main>
  <script>
    (() => {
      const userAgent = navigator.userAgent || '';
      const isWindowsPhone = /windows phone/i.test(userAgent);
      const isAndroid = !isWindowsPhone && /android/i.test(userAgent);
      // iPadOS can identify itself as a Mac when browsing in desktop mode.
      const isIOS = !isWindowsPhone && (
        /iPad|iPhone|iPod/i.test(userAgent) ||
        (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1)
      );

      if (isIOS) {
        document.getElementById('android-link').hidden = true;
        document.getElementById('device-message').textContent =
          'Download MamaCare Hub for your iPhone or iPad from the App Store.';
      } else if (isAndroid) {
        document.getElementById('ios-link').hidden = true;
        document.getElementById('device-message').textContent =
          'Download MamaCare Hub for your Android device from Google Play.';
      }
    })();
  </script>
</body>
</html>
