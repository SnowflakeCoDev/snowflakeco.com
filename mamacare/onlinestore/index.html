<!DOCTYPE html>
<html>
<head>
  <style>
    /* ---- Native loader (shows instantly, before Flutter boots) ---- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FFFFFF; /* match AppColors.cream so there's no flash */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FEEFEA;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(26, 20, 9, 0.12);
      border-top-color: #1A1409;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 2.4px;
      font-weight: 600;
      color: rgba(89, 37, 51, 1);
      text-transform: uppercase;
    }

    .brand {
      position: absolute;
      bottom: 32px;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
      color: rgba(89, 37, 51, 1);
      text-transform: uppercase;
    }
  </style>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="../onlinestore/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mama Care">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mama Care Hub">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.jpg"/>

  <title>Mama Care Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Loading</div>
  <div class="brand">Mama Care Hub</div>
</div>
<script>
  // ----------------------------------------------------------------
  // Loader controller
  //
  // The loader hides only when BOTH conditions are true:
  //   1. Flutter has fired 'flutter-first-frame' (the app is ready).
  //   2. At least MIN_DISPLAY_MS have passed since page load.
  //
  // This guarantees the loader is always visible long enough to be
  // seen — even on cached refreshes when Flutter boots in <100ms.
  // ----------------------------------------------------------------

  var MIN_DISPLAY_MS = 1000;     // minimum time the loader stays visible
  var flutterReady = false;
  var minTimePassed = false;

  function tryHideLoader() {
    if (!flutterReady || !minTimePassed) return;

    var loader = document.getElementById('loader');
    if (!loader) return;

    loader.classList.add('fade-out');
    setTimeout(function () {
      if (loader.parentNode) loader.parentNode.removeChild(loader);
      document.body.style.overflow = '';
    }, 450);
  }

  // Condition 1: Flutter is ready
  window.addEventListener('flutter-first-frame', function () {
    flutterReady = true;
    tryHideLoader();
  });

  // Condition 2: minimum display time has passed
  setTimeout(function () {
    minTimePassed = true;
    tryHideLoader();
  }, MIN_DISPLAY_MS);
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
